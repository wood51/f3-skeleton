<div class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-4xl relative">
    <!-- Bouton fermeture -->
    <button id="btn-close" _="on click set #modal.innerHTML to ''" class="absolute top-4 right-4 text-2xl text-gray-500 hover:text-gray-700">&times;</button>

    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Ajouter un lot</h2>

    <form
      id="formLotsToles"
      name="formLotsToles"
      class="grid grid-cols-1 md:grid-cols-2 gap-4"
      hx-post="/toles/save"
      hx-target="#lotsTableContainer"
      hx-swap="innerHTML"
      _="on htmx:afterRequest 
            if event.detail.successful 
            then 
            set #modal.innerHTML to ''"
      autocomplete="off"
    >
      <input type="hidden" name="id" value="{{ isset(@lot.id) ? @lot.id : '' }}" />

      <!-- Référence -->
      <div>
        <label for="reference" class="label">Référence</label>
        <input type="text" id="reference" name="reference" value="{{ isset(@lot.reference) ? @lot.reference : '' }}" class="form-input" />
      </div>

      <!-- Commandes -->
      <div>
        <label for="no_commande_fournisseur" class="label">N° Cmde Fournisseur</label>
        <input type="text" id="no_commande_fournisseur" name="no_commande_fournisseur" value="{{ isset(@lot.no_commande_fournisseur) ? @lot.no_commande_fournisseur : '' }}" class="form-input" />
      </div>

      <div>
        <label for="no_commande_guinault" class="label">N° Cmde Guinault</label>
        <input type="text" id="no_commande_guinault" name="no_commande_guinault" value="{{ isset(@lot.no_commande_guinault) ? @lot.no_commande_guinault : '' }}" class="form-input" />
      </div>

      <!-- Quantité & Poids -->
      <div>
        <label for="quantite_servie" class="label">Quantité Servie</label>
        <input type="number" id="quantite_servie" name="quantite_servie" value="{{ isset(@lot.quantite_servie) ? @lot.quantite_servie : '' }}" class="form-input" />
      </div>

      <div>
        <label for="poids" class="label">Poids</label>
        <input type="number" id="poids" name="poids" value="{{ isset(@lot.poids) ? @lot.poids : '' }}" class="form-input" />
      </div>

      <div>
        <label for="quantite_rebut" class="label">Quantité Rebut</label>
        <input type="number" id="quantite_rebut" name="quantite_rebut" value="{{ isset(@lot.quantite_rebut) ? @lot.quantite_rebut : '0' }}" class="form-input" />
      </div>

      <!-- Dates -->
      <div>
        <label for="date_fabrication" class="label">Date Fabrication</label>
        <input
          type="date"
          id="date_fabrication"
          name="date_fabrication"
          value="{{ isset(@lot.date_fabrication) ? date('Y-m-d', strtotime(@lot.date_fabrication)) : '' }}"
          class="form-input"
        />
      </div>

      <div>
        <label for="date_reception_guinault" class="label">Date Réception Guinault</label>
        <input
          type="date"
          id="date_reception_guinault"
          name="date_reception_guinault"
          value="{{ isset(@lot.date_reception_guinault) ? date('Y-m-d', strtotime(@lot.date_reception_guinault)) : '' }}"
          class="form-input"
        />
      </div>

      <div>
        <label for="date_reception_dee" class="label">Date Réception DEE</label>
        <input
          type="date"
          id="date_reception_dee"
          name="date_reception_dee"
          value="{{ isset(@lot.date_reception_dee) ? date('Y-m-d', strtotime(@lot.date_reception_dee)) : '' }}"
          class="form-input"
        />
      </div>

      <!-- FNC -->
      <div>
        <label for="no_fnc" class="label flex items-center gap-1">
          N° FNC
          <i class="fas fa-info-circle text-sm text-gray-400" title="Numéro FNC lié à un écart qualité."></i>
        </label>
        <input type="text" id="no_fnc" name="no_fnc" value="{{ isset(@lot.no_fnc) ? @lot.no_fnc : '' }}" class="form-input" />
      </div>

      <!-- Commentaires -->
      <div class="md:col-span-2">
        <label for="commentaires" class="label flex items-center gap-1">
          Commentaires
          <i class="fas fa-pencil-alt text-sm text-gray-400" title="Ajouter un commentaire libre"></i>
        </label>
        <textarea id="commentaires" name="commentaires" rows="3" class="form-input resize-none">{{ isset(@lot.commentaires) ? @lot.commentaires : '' }}</textarea>
      </div>

      <!-- Boutons -->
      <div class="md:col-span-2 flex justify-end gap-3 mt-4">
        <button type="button" _="on click set #modal.innerHTML to ''" class="btn-secondary">Annuler</button>
        <button type="submit" class="btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>
