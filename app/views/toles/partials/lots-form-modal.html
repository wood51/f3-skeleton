<div class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded shadow-lg p-6 w-1/2 relative">
    <!-- Bouton fermeture -->
    <button id="btn-close" class="absolute top-2 right-2">&times;</button>

    <h2 class="text-lg font-bold mb-4">Ajouter un lot</h2>

    <form
      id="formLotsToles"
      name="formLotsToles"
      class="m-4 p-4"
      hx-post="/toles/save"
      hx-target="#lotsTableContainer"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) {closeModal();}"
      autocomplete="off"
    >
      <input type="hidden" name="id" value="{{isset(@lot.id) ? @lot.id : ''}}" />

      <label for="reference" class="block text-gray-700">Référence :</label>
      <input type="text" id="reference" name="reference" value="{{isset(@lot.reference) ? @lot.reference : ''}}" class="w-full border p-2 rounded-md mb-2" />

      <label for="no_commande_fournisseur" class="block text-gray-700">N° Cmde Fournisseur :</label>
      <input
        type="text"
        id="no_commande_fournisseur"
        name="no_commande_fournisseur"
        value="{{isset(@lot.no_commande_fournisseur) ? @lot.no_commande_fournisseur : ''}}"
        class="w-full border p-2 rounded-md mb-2"
      />

      <label for="no_commande_guinault" class="block text-gray-700">N° Cmde Guinault :</label>
      <input
        type="text"
        id="no_commande_guinault"
        name="no_commande_guinault"
        value="{{isset(@lot.no_commande_guinault) ? @lot.no_commande_guinault : ''}}"
        class="w-full border p-2 rounded-md mb-2"
      />

      <label for="quantite_servie" class="block text-gray-700">Quantité Servie :</label>
      <input
        type="number"
        id="quantite_servie"
        name="quantite_servie"
        value="{{isset(@lot.quantite_servie) ? @lot.quantite_servie : ''}}"
        class="w-full border p-2 rounded-md mb-2"
      />

      <label for="poids" class="block text-gray-700">Poids:</label>
      <input type="number" id="poids" name="poids" value="{{isset(@lot.poids) ? @lot.poids : ''}}" class="w-full border p-2 rounded-md mb-2" />

      <label for="quantite_rebut" class="block text-gray-700">Quantité Rebut :</label>
      <input type="number" id="quantite_rebut" name="quantite_rebut" value="{{isset(@lot.quantite_rebut) ? @lot.quantite_rebut : '0'}}" class="w-full border p-2 rounded-md mb-2" />

      <label for="date_fabrication" class="block text-gray-700">Date Fabrication :</label>
      <input
        type="date"
        id="date_fabrication"
        name="date_fabrication"
        value="{{isset(@lot.date_fabrication) ? date('Y-m-d', strtotime(@lot.date_fabrication)) : ''}}"
        class="w-full border p-2 rounded-md mb-2"
      />

      <label for="date_reception_guinault" class="block text-gray-700">Date Réception Guinault :</label>
      <input
        type="date"
        id="date_reception_guinault"
        name="date_reception_guinault"
        value="{{isset(@lot.date_reception_guinault) ? date('Y-m-d', strtotime(@lot.date_reception_guinault)) : NULL}}"
        class="w-full border p-2 rounded-md mb-2"
      />

      <label for="date_reception_dee" class="block text-gray-700">Date Réception DEE :</label>
      <input
        type="date"
        id="date_reception_dee"
        name="date_reception_dee"
        value="{{isset(@lot.date_reception_dee) ? date('Y-m-d', strtotime(@lot.date_reception_dee)) : ''}}"
        class="w-full border p-2 rounded-md mb-2"
      />

      <div class="flex justify-end space-x-2 mt-4">
        <button id="btn-annuler" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-700">Annuler</button>
        <button id="btn-save" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700">Enregistrer</button>
      </div>
    </form>
  </div>
</div>
<script>
  document.addEventListener("click", function (event) {
    if (!event.target.matches("#btn-close, #btn-annuler")) return;
    closeModal();
  });

  function closeModal() {
    const modal = document.getElementById("modal");
    const form = document.getElementById("formLotsToles");
    modal.innerHTML = "";
  }
</script>
