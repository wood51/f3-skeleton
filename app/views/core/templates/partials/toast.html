<check if="{{ isset(@toast) }}">
    <div 
      id="toast"
      data-toast-success
      class="fixed top-4 right-4 flex items-center gap-3 bg-green-500 text-white px-5 py-3 rounded-lg shadow-lg animate-fade-in-out"
      _="init setTimeout(() => me.remove(), 4000)"
    >
      <i class="fas fa-check-circle text-xl"></i>
      <span class="flex-1">{{ @toast }}</span>
      <button class="text-white text-lg" _="on click remove #toast">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </check>
  
  <check if="{{ isset(@error) }}">
    <div 
      id="toast"
      class="fixed top-4 right-4 flex items-center gap-3 bg-red-600 text-white px-5 py-3 rounded-lg shadow-lg animate-fade-in-out"
      _="init setTimeout(() => me.remove(), 5000)"
    >
      <i class="fas fa-exclamation-circle text-xl"></i>
      <span class="flex-1">{{ @error }}</span>
      <button class="text-white text-lg" _="on click remove #toast">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </check>
