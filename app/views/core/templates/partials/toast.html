<check if="{{ isset(@toast) }}">
  <div class="toast fixed top-4 right-4 flex items-center gap-3 bg-green-500 text-white px-5 py-3 rounded-lg shadow-lg animate-fade-in-out z-50" _="init wait 5s then remove me">
    <i class="fas fa-check-circle text-xl"></i>
    <span class="flex-1">{{ @toast }}</span>
    <button class="text-white text-lg" _="on click remove closest .toast">
      <i class="fas fa-times"></i>
    </button>
  </div>
</check>

<check if="{{ isset(@error) }}">
  <div class="toast fixed top-4 right-4 flex items-center gap-3 bg-red-600 text-white px-5 py-3 rounded-lg shadow-lg animate-fade-in-out z-50" _="init wait 5s then remove me">
    <i class="fas fa-exclamation-circle text-xl"></i>
    <span class="flex-1">{{ @error }}</span>
    <button class="text-white text-lg" _="on click remove closest .toast">
      <i class="fas fa-times"></i>
    </button>
  </div>
</check>
