<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestprod Login</title>

    <link rel="shortcut icon" href="{{@BASE}}/{{@UI}}/assets/img/gear.png" type="image/png" />
    <link href="{{@BASE}}/{{@UI}}/assets/css/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{@BASE}}/{{@UI}}/assets/css/all.min.css" />

    <script src="{{@BASE}}/{{@UI}}/assets/js/htmx.min.js"></script>
    <script src="{{@BASE}}/{{@UI}}/assets/js/_hyperscript.min.js"></script>
  </head>

  <body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-white via-gray-200 to-white p-4">

    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-10 border border-gray-200">
        <div class="flex flex-col items-center mb-6">
          <i class="fas fa-user-lock text-4xl text-blue-600 mb-2"></i>
          <h2 class="text-2xl font-bold text-gray-800">Connexion à Gestprod</h2>
          <p class="text-gray-500 text-sm">Veuillez entrer vos identifiants</p>
        </div>
    
        <div id="login-response" class="mb-4 text-sm"></div>
    
        <form 
          id="login-form"
          hx-post="/auth"
          hx-target="#login-response"
          hx-swap="innerHTML"
          hx-include="[name=csrf_token]"
          _="on htmx:afterRequest 
             if document.querySelector('[data-toast-success]') 
             then call window.location.assign('/')"
          class="space-y-5"
        >
          <div>
            <label for="username" class="block text-sm font-medium text-gray-600">Nom d'utilisateur</label>
            <div class="flex items-center border rounded-lg px-3 py-2 mt-1 bg-white shadow-sm focus-within:ring-2 focus-within:ring-blue-500">
              <i class="fas fa-user text-gray-400 mr-2"></i>
              <input 
                type="text" 
                name="username" 
                id="username"
                class="w-full border-none outline-none text-gray-800"
                required
              />
            </div>
          </div>
    
          <div>
            <label for="password" class="block text-sm font-medium text-gray-600">Mot de passe</label>
            <div class="flex items-center border rounded-lg px-3 py-2 mt-1 bg-white shadow-sm focus-within:ring-2 focus-within:ring-blue-500">
              <i class="fas fa-lock text-gray-400 mr-2"></i>
              <input 
                type="password" 
                name="password" 
                id="password"
                class="w-full border-none outline-none text-gray-800"
                autocomplete="off"
                required
              />
            </div>
          </div>
    
          <input type="hidden" name="csrf_token" value="{{ @csrf_token }}" />
    
          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 transition-colors text-white font-semibold py-2 rounded-lg shadow"
          >
            <i class="fas fa-sign-in-alt mr-2"></i> Se connecter
          </button>
        </form>
      </div>
    </div>
    
  </body>
</html>
